# GLAZESMPSERVER EaglerXPaper notes
#
# EaglerXPaper generates its actual configuration files in this directory on first boot.
# Its documented default dual-stack listener shares Paper's main port (25565) and
# automatically detects WebSocket handshakes versus vanilla Minecraft TCP.
#
# This file intentionally contains comments only: do not guess listener/config keys here.
# After first startup, inspect the generated EaglerXPaper/EaglercraftXServer config files
# and edit the generated listener settings if needed. Preserve generated values unless
# you have checked them against the version's documentation.
#
# Public Docker ports:
#   25565/tcp -> container 25565 (Java + Eaglercraft)
#   25569/tcp -> container 25565 (alternate Eaglercraft URL)
#
# WSS/TLS should be terminated by a reverse proxy with a valid certificate.
