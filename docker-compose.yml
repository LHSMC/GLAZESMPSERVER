services:
  paper:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PAPER_VERSION: "1.21.1"
        PAPER_BUILD: "latest"
    container_name: glazesmp-server
    restart: unless-stopped
    # Use public DNS resolvers; the Codespace Azure resolver times out on the Compose network.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      EULA: "TRUE"
      MEMORY: "${MEMORY:-3G}"
      SERVER_PORT: "25565"
      ONLINE_MODE: "${ONLINE_MODE:-true}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-6}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-4}"
    ports:
      - "25565:25565/tcp"
      # Eaglercraft browser clients can use this alternate public port.
      # Both ports target EaglerXPaper's dual-stack listener inside the container.
      - "25569:25565/tcp"
    volumes:
      - paper-data:/data
      # Persist generated bridge config separately from the immutable image.
      - ./plugins/EaglercraftXServer:/data/plugins/EaglercraftXServer
    stop_grace_period: 60s
    init: true

volumes:
  paper-data:
    name: glazesmp-paper-data
